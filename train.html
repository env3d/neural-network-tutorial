<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1"> 
        <style>

         main {
             margin: auto;
             box-sizing: border-box; 
             display: grid;

             padding: 1rem;
         }

         h3{
            font-size: 1.3rem;
            margin: 2rem 0 0 0;
         }

         @media only screen and (min-width:  600px) {
            main{
                    grid-template-columns: 300px 300px;
                }

                h3{
                    display: none;
                }
         }

         .displayArea {
             width: 280;
             height: 280;
             border-style: solid;
         }

         #itemToDraw {
             font-size: 800%;
             text-align: center;
         }

         #itemToDraw * {
             position: relative;
             margin-top: 50px;
         }

         @media screen and (max-width: 600px) {
             /* body {
                 width: 300px;
                 grid-template-columns: 300px;
             } */

             #itemToDraw {                 
                 height: 140px;
                 display: flex;
             }

             #itemToDraw * {
                 margin: auto;
             }
         }

        </style>
        <link rel="stylesheet" href="./styles/style.css">
        <script defer src="https://use.fontawesome.com/releases/v5.0.6/js/all.js"></script> 
        <script defer src="draw.js"></script>
        <script>
         
         window.trainingData = [];
         
         function saveTrainingData(dataItem, where) {
             if (where && where == 'firebase') {
                 fetch('https://ml-train-data.firebaseio.com/train.json', {
                     method: 'post',
                     body: JSON.stringify(dataItem)
                 });
             } else {
                 trainingData.push(dataItem);
             }
         }
         
         window.addEventListener('load', function() {

             let myCanvas = new DrawCanvas(document.getElementById('myCanvas'));

             myCanvas.onPenUp(() => {
                 // create data package
                 let dataItem = {
                     imageData: myCanvas.getImageData(),
                     clssification: icons[currentIcon % icons.length],
                     time: Date.now()
                 }

                 saveTrainingData(dataItem, 'firebase');
                 
                 // show next icon
                 document.getElementById('itemToDraw').innerHTML = "<i class='"+icons[++currentIcon % icons.length]+"'></i>";
                 myCanvas.clear();
             });

             let icons = ['fas fa-battery-empty', 'fas fa-bolt', 'fas fa-check', 'far fa-folder'];
             let currentIcon = parseInt(Math.random() * 4);
             
             document.getElementById('itemToDraw').innerHTML = "<i class='"+icons[currentIcon]+"'></i>";
         });
         
         
        </script>

    </head>
    <body>
        <div class="bodyWrapper">
            <header>

                <h1>Model and Tune your AI.</h1>
                <nav>
                    <ul>
                        <li class="selected">
                            <a href="#">Train AI</a>
                        </li>
                        <li >
                            <a href="./index.html">Results</a>
                        </li>
                    </ul>
                </nav>
            </header>
            <main>
                <div class="displayArea" id="itemToDraw">
                </div>
                <div>
                    <h3>Draw here:</h3>
                    <canvas class="displayArea" id="myCanvas" width="28" height="28"></canvas>
                    <section id="prediction"></section>
                    <svg id="stats"></svg>
                </div>
            </main>
            <footer>
                <div class="program">Post Degree Diploma - Web & Mobile App Design & Development (WMDD)</div>
                <div class="branding">
                    <div class="brandLogo"><img src="./images/langara-logo.png" alt="Langara Logo"></div>
                </div>
            </footer>
        </div>
    </body>
</html>
